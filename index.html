<style>.exercise-chart-link{background:transparent;border:0;color:#b2d0ff;font:inherit;font-weight:700;cursor:pointer;text-align:left;padding:7px 0;min-height:40px;text-decoration:underline;text-decoration-color:#526d90;text-underline-offset:4px}.exercise-chart-link:hover,.exercise-chart-link:focus-visible{color:#e2efff}</style></head><body><div class="mobile-backdrop hidden" id="mobileBackdrop" onclick="closeMenu()"></div><aside class="mobile-drawer hidden" id="mobileDrawer"><div class="drawer-head"><div><strong>Gym Tracker</strong><div class="drawer-sub">Вибери потрібний розділ</div></div><button class="iconbtn" onclick="closeMenu()" aria-label="Закрити меню">✕</button></div><nav class="drawer-tabs" id="mobileTabs"></nav></aside><div class="shell"><header><div class="header-main"><button class="hamburger" id="mobileMenuBtn" onclick="toggleMenu()" aria-label="Відкрити меню">☰</button><div><div class="brand">PERSONAL TRAINING LOG</div><h1>Gym Tracker <span style="color:#8db8ff">●</span></h1></div></div><div class="header-right"><div class="section-chip" id="currentSectionLabel"></div><div class="muted" id="dateLabel"></div></div></header><nav class="tabs" id="tabs"></nav><main id="app"></main><footer id="footerMeta">Локальне зберігання на пристрої · Хмарна синхронізація ще не підключена.</footer></div><input id="importFile" class="hidden" type="file" accept="application/json,.json"><script src="firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" defer></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js" defer></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js" defer></script><script>
'use strict';const APP_VERSION='3.0.0';const KEY='gym-tracker-v1';const DRAFTKEY='gym-tracker-active-v1';const DAYS=['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];const FULL=['Неділя','Понеділок','Вівторок','Середа','Четвер','П’ятниця','Субота'];const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);const today=()=>new Date().toLocaleDateString('en-CA');const blank=()=>({version:1,templates:[],sessions:[],bodyWeights:[],measurements:[]});let state;try{state=JSON.parse(localStorage.getItem(KEY))||blank();if(!Array.isArray(state.templates)||!Array.isArray(state.sessions))throw Error()}catch(e){state=blank();alert('Не вдалося прочитати збережені дані. За наявності резервної копії імпортуй її у налаштуваннях.')}if(!Array.isArray(state.bodyWeights))state.bodyWeights=[];if(!Array.isArray(state.measurements))state.measurements=[];let tab='home',editDay=new Date().getDay(),active=null;try{const draft=JSON.parse(localStorage.getItem(DRAFTKEY));if(draft&&Array.isArray(draft.exercises)&&draft.id)active=draft}catch(_){}// v1.5: keep backward-compatible localStorage and a second device-local IndexedDB copy.
// Cloud syncing is deliberately NOT enabled. Data remains on this browser/device.
let db=null, dbReady=false, storageMode='localStorage', writeQueue=Promise.resolve();
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(Error('IndexedDB недоступна'));const r=indexedDB.open('gym-tracker-db',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('records'))r.result.createObjectStore('records')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||Error('Помилка бази'))})}
function dbGet(){return new Promise((resolve,reject)=>{let tx=db.transaction('records','readonly'),req=tx.objectStore('records').get('snapshot');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function dbPut(value){return new Promise((resolve,reject)=>{let tx=db.transaction('records','readwrite');tx.objectStore('records').put(value,'snapshot');tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
function persistDB(){if(!dbReady)return;const snapshot=structuredClone({state,active,updated:new Date().toISOString()});writeQueue=writeQueue.catch(()=>{}).then(()=>dbPut(snapshot)).catch(err=>{storageMode='localStorage (помилка IndexedDB)';console.error('Gym Tracker storage:',err)});}
function saveDraft(){try{if(active)localStorage.setItem(DRAFTKEY,JSON.stringify(active));else localStorage.removeItem(DRAFTKEY)}catch(e){console.warn('Не вдалося зберегти чернетку у localStorage',e)}persistDB()}
function save(){scheduleAutoSync();try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){console.warn('Не вдалося зберегти у localStorage',e)}persistDB()}
async function initStore(){try{db=await openDB();const saved=await dbGet();const localHasData=state.templates.length>0||state.sessions.length>0||!!active;if(!localHasData&&saved&&saved.state&&Array.isArray(saved.state.templates)&&Array.isArray(saved.state.sessions)){state=saved.state;active=saved.active||null;try{localStorage.setItem(KEY,JSON.stringify(state));if(active)localStorage.setItem(DRAFTKEY,JSON.stringify(active))}catch(_){};}dbReady=true;storageMode='localStorage + IndexedDB';persistDB();}catch(e){storageMode='localStorage';console.warn('IndexedDB unavailable:',e)}render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dateFmt(d){return new Date(d+'T12:00:00').toLocaleDateString('uk-UA',{day:'numeric',month:'long',year:'numeric'})}let menuOpen=false;function syncMenu(){document.body.classList.toggle('menu-open',menuOpen);document.getElementById('mobileBackdrop').classList.toggle('hidden',!menuOpen);document.getElementById('mobileDrawer').classList.toggle('hidden',!menuOpen);document.getElementById('mobileDrawer').classList.toggle('open',menuOpen)}function openMenu(){menuOpen=true;syncMenu()}function closeMenu(){menuOpen=false;syncMenu()}function toggleMenu(){menuOpen=!menuOpen;syncMenu()}function nav(t){tab=t;closeMenu();render()}const menu=[['home','Огляд'],['body','Параметри тіла'],['workout','Тренування'],['plan','Розклад'],['history','Історія'],['progress','Прогрес'],['insights','Досягнення'],['friends','Друзі'],['settings','Дані']];document.getElementById('tabs').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b)nav(b.dataset.tab)});document.getElementById('mobileTabs').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b)nav(b.dataset.tab)});document.getElementById('dateLabel').textContent=new Date().toLocaleDateString('uk-UA',{day:'numeric',month:'short'});document.getElementById('footerMeta').innerHTML='Локальні дані на пристрої · <button type="button" class="version-secret version-tag" onclick="tapVersion(event)" aria-label="Версія застосунку">v'+APP_VERSION+'</button>';window.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
function render(){const buttons=menu.map(([k,n])=>`<button data-tab="${k}" class="${tab===k?'selected':''}">${n}</button>`).join('');document.getElementById('tabs').innerHTML=buttons;document.getElementById('mobileTabs').innerHTML=buttons;document.getElementById('currentSectionLabel').textContent=(menu.find(([k])=>k===tab)||['','Розділ'])[1];document.getElementById('app').innerHTML=({home:home,body:bodyPage,workout:workout,plan:plan,history:history,progress:progress,insights:insights,friends:friendsPage,settings:settings})[tab]();updateRestUI();}
function home(){const s=state.sessions,done=s.filter(x=>x.finished),volume=done.reduce((a,x)=>a+x.exercises.reduce((sum,e)=>sum+e.sets.filter(t=>setComplete(t,e)).reduce((z,t)=>z+setVolume(t,e),0),0),0);const last=[...done].sort((a,b)=>b.finished.localeCompare(a.finished))[0];return `<section class="grid"><div class="tile">Завершено тренувань<strong>${done.length}</strong></div><div class="tile">Виконано підходів<strong>${done.reduce((n,x)=>n+x.exercises.reduce((z,e)=>z+e.sets.filter(t=>setComplete(t,e)).length,0),0)}</strong></div><div class="tile">Тренувальний обсяг<strong>${Math.round(volume).toLocaleString('uk-UA')} кг</strong></div></section><section class="panel"><div class="hero"><div><span class="eyebrow">ТВІЙ ПЛАН НА СЬОГОДНІ</span><div class="hero-title">${FULL[new Date().getDay()]}</div><span class="pill">● Готовий до тренування</span></div></div><p>${state.templates.filter(x=>x.day===new Date().getDay()).length?'У розкладі є заплановані вправи. Можеш почати тренування з ними.':'На сьогодні немає вправ у розкладі. Можеш почати вільне тренування.'}</p><div class="hero-actions"><button class="primary" onclick="start('plan')">▶ За розкладом</button><button onclick="start('free')">＋ Вільне тренування</button></div>${active?'<div class="notice">У тебе є незавершене тренування. Відкрий вкладку «Тренування».</div>':''}</section><section class="panel"><h2>Останнє тренування</h2>${last?`<strong>${esc(last.title)}</strong><p>${dateFmt(last.date)} · ${last.exercises.length} вправ</p>`:'<div class="empty">Історія порожня. Запиши перше тренування!</div>'}</section>`}
function setVolume(st,ex){if(!setComplete(st,ex))return 0;const w=Number(st.weight)||0;if(ex.unilateral){return w*((st.rightDone?(Number(st.rightReps)||0):0)+(st.leftDone?(Number(st.leftReps)||0):0))}return w*(Number(st.reps)||0)}
function setComplete(st,ex){return ex.unilateral?!!(st.leftDone&&st.rightDone):!!st.done}
function toggleUnilateral(i){if(!active)return;const e=active.exercises[i];e.unilateral=!e.unilateral;for(const st of e.sets){if(e.unilateral){st.leftReps=st.leftReps||st.reps||'';st.rightReps=st.rightReps||st.reps||'';st.leftDone=!!st.done;st.rightDone=!!st.done}else{st.reps=st.reps||st.leftReps||'';st.done=!!(st.leftDone&&st.rightDone)}}saveDraft();render()}
function editSide(i,j,side,key,val){let st=active.exercises[i].sets[j],ex=active.exercises[i];const before=setComplete(st,ex);if(key==='done')st[side+'Done']=val;else st[side+'Reps']=String(val).replace(/[^0-9]/g,'').slice(0,4);st.done=setComplete(st,ex);saveDraft();if(key==='done'){if(!before&&st.done)startRest();render()}}
let bodyPeriod=90;
function saveBodyWeight(){const input=document.getElementById('bodyWeightValue'),date=document.getElementById('bodyWeightDate');if(!input||!date)return;const kg=Number(input.value.replace(',','.'));if(!(kg>=20&&kg<=400)||!/^\d{4}-\d{2}-\d{2}$/.test(date.value)){alert('Вкажи коректну дату й вагу від 20 до 400 кг');return}const idx=state.bodyWeights.findIndex(x=>x.date===date.value);const item={date:date.value,kg};if(idx>=0){if(!confirm('Для цієї дати вже є запис. Замінити?'))return;state.bodyWeights[idx]=item}else state.bodyWeights.push(item);state.bodyWeights.sort((a,b)=>a.date.localeCompare(b.date));save();render()}
function removeBodyWeight(d){if(!confirm('Видалити запис ваги за '+d+'?'))return;state.bodyWeights=state.bodyWeights.filter(x=>x.date!==d);save();render()}
function weightGraph(points){if(!points.length)return '<div class="empty">Після першого вимірювання тут з’явиться графік.</div>';const W=760,H=280,pad=46,min=Math.min(...points.map(x=>x.kg)),max=Math.max(...points.map(x=>x.kg)),lo=Math.floor((min-1)*2)/2,hi=Math.ceil((max+1)*2)/2,den=hi-lo||1;const xy=points.map((v,i)=>[pad+(W-pad*2)*(points.length===1?.5:i/(points.length-1)),H-pad-(v.kg-lo)/den*(H-pad*2)]);let d=xy.map(([x,y],i)=>(i?'L':'M')+x.toFixed(2)+' '+y.toFixed(2)).join(' ');return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" class="analytics-chart" role="img" aria-label="Графік ваги тіла">${Array.from({length:5},(_,i)=>{const y=pad+(H-2*pad)*i/4;return `<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="#30425b" stroke-dasharray="4 5"/><text x="4" y="${y+4}" fill="#9bb0c9" font-size="14">${(hi-i*den/4).toFixed(1)}</text>`}).join('')}<path d="${d}" fill="none" stroke="#9ac2ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${xy.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="5" fill="#66ddb0"><title>${points[i].date}: ${points[i].kg} кг</title></circle>`).join('')}</svg><div class="row between"><small>${dateFmt(points[0].date)}</small><small>${dateFmt(points.at(-1).date)}</small></div></div>`}
function bodyPage(){const all=state.bodyWeights||[];const cutoff=Date.now()-bodyPeriod*86400000;const shown=bodyPeriod?all.filter(x=>new Date(x.date+'T12:00:00').getTime()>=cutoff):all;const first=shown[0],last=shown.at(-1),delta=first&&last?last.kg-first.kg:0;return `<section class="panel"><span class="eyebrow">ТВІЙ ПРОГРЕС</span><h2>⚖️ Вага тіла</h2><p>Записуй вагу з датою. Графік будується автоматично, усі значення залишаються на пристрої.</p><div class="body-metrics"><div class="tile">Останній запис<strong>${all.length?all.at(-1).kg.toLocaleString('uk-UA')+' кг':'—'}</strong></div><div class="tile">Зміна за період<strong>${shown.length>1?(delta>0?'+':'')+delta.toFixed(1)+' кг':'—'}</strong></div></div><div class="body-form"><div class="field"><label>Дата вимірювання</label><input id="bodyWeightDate" type="date" value="${today()}"></div><div class="field"><label>Вага, кг</label><input id="bodyWeightValue" inputmode="decimal" type="text" placeholder="70.5"></div><button class="primary" onclick="saveBodyWeight()">＋ Записати</button></div><div class="row body-period">${[[30,'30 днів'],[90,'3 місяці'],[180,'6 місяців'],[365,'Рік'],[0,'Увесь час']].map(([n,l])=>`<button class="small ${bodyPeriod===n?'primary':''}" onclick="bodyPeriod=${n};render()">${l}</button>`).join('')}</div>${weightGraph(shown)}<p class="chart-caption">Короткочасні коливання ваги нормальні. Для порівняння краще зважуватися за однакових умов.</p></section><section class="panel"><h2>Історія вимірювань</h2>${all.length?[...all].reverse().map(x=>`<div class="entry row between"><span>${dateFmt(x.date)}</span><strong>${x.kg.toLocaleString('uk-UA')} кг</strong><button class="small danger" onclick="removeBodyWeight('${x.date}')">Видалити</button></div>`).join(''):'<div class="empty">Поки немає записів.</div>'}</section>${measurementsPanel()}`}

const BODY_METRICS=[['arm','Плечова частина руки'],['chest','Груди'],['waist','Талія'],['shoulders','Плечі'],['hips','Стегна'],['thigh','Стегно (одне)'],['calf','Гомілка (нижче коліна)'],['forearm','Передпліччя']];
let measureMetric='arm',measurePeriod=90,measureContext='all';
function addMeasurement(){const metric=document.getElementById('measureMetric'),value=document.getElementById('measureValue'),date=document.getElementById('measureDate'),context=document.getElementById('measureContext');if(!metric||!value||!date)return;const cm=Number(value.value.replace(',','.'));if(!Number.isFinite(cm)||cm<10||cm>300||!/^\d{4}-\d{2}-\d{2}$/.test(date.value)){alert('Перевір дату та обхват у сантиметрах');return}state.measurements.push({id:uid(),metric:metric.value,cm, date:date.value,context:context.value});save();measureMetric=metric.value;render()}
function delMeasurement(id){if(!confirm('Видалити замір?'))return;state.measurements=state.measurements.filter(x=>x.id!==id);save();render()}
function measurementsPanel(){const contextNames={before:'До тренування',after:'Після тренування (памп)',rest:'День відпочинку'};const from=Date.now()-measurePeriod*86400000;const filtered=(state.measurements||[]).filter(x=>x.metric===measureMetric&&(measureContext==='all'||measureContext===x.context)&&(!measurePeriod||new Date(x.date+'T12:00:00').getTime()>=from)).sort((a,b)=>a.date.localeCompare(b.date));const points=filtered.map(x=>({date:x.date,kg:x.cm}));const opts=BODY_METRICS.map(([key,label])=>`<option value="${key}" ${measureMetric===key?'selected':''}>${label}</option>`).join('');return `<section class="panel"><h2>📏 Параметри тіла</h2><p>Вимірюй у схожих умовах. Для об'єктивного порівняння найкраще використовувати заміри до тренування або в день відпочинку.</p><div class="body-form"><div class="field"><label>Дата</label><input id="measureDate" type="date" value="${today()}"></div><div class="field"><label>Обхват, см</label><input id="measureValue" type="number" inputmode="decimal" min="10" max="300" step="0.1" placeholder="Наприклад, 35.5"></div><div class="field"><label>Параметр</label><select id="measureMetric">${opts}</select></div><div class="field"><label>Коли вимірював?</label><select id="measureContext"><option value="rest">У день відпочинку</option><option value="before">До тренування</option><option value="after">Після тренування (памп)</option></select></div><button class="primary" onclick="addMeasurement()">+ Записати замір</button></div><div class="analytics-controls"><div><label>Параметр графіка</label><select onchange="measureMetric=this.value;render()">${opts}</select></div><div><label>Період</label><select onchange="measurePeriod=Number(this.value);render()">${[[30,'30 днів'],[90,'3 місяці'],[180,'6 місяців'],[365,'Рік'],[0,'Увесь час']].map(([v,l])=>`<option value="${v}" ${v===measurePeriod?'selected':''}>${l}</option>`).join('')}</select></div><div><label>Умови</label><select onchange="measureContext=this.value;render()">${[['all','Всі заміри'],['rest','День відпочинку'],['before','До тренування'],['after','Після тренування']].map(([v,l])=>`<option value="${v}" ${v===measureContext?'selected':''}>${l}</option>`).join('')}</select></div></div>${weightGraph(points).replaceAll('кг','см')}<p class="chart-caption">У графіку показані лише вибрані параметри й умови; памп може тимчасово змінювати обхвати.</p><h3>Історія замірів</h3>${filtered.length?filtered.slice().reverse().map(x=>`<div class="entry row between"><div><strong>${x.cm.toLocaleString('uk-UA')} см</strong><br><small>${dateFmt(x.date)} · ${contextNames[x.context]||''}</small></div><button class="small danger" onclick="delMeasurement('${x.id}')">Видалити</button></div>`).join(''):'<div class="empty">Ще немає замірів цього параметра.</div>'}</section>`}

function templateForDay(d){return state.templates.filter(x=>x.day===d)}function addTemplate(){const el=document.getElementById('newExercise'),name=el.value.trim();if(!name)return;state.templates.push({id:uid(),day:editDay,name,unilateral:document.getElementById('templateUnilateral')?.checked||false});el.value='';save();render();document.getElementById('newExercise')?.focus()}function removeTemplate(id){if(!confirm('Прибрати вправу з розкладу?'))return;state.templates=state.templates.filter(t=>t.id!==id);save();render()}function plan(){return `<section class="panel"><h2>Тижневий розклад</h2><div class="row">${[1,2,3,4,5,6,0].map(d=>`<button class="day ${editDay===d?'active':''}" onclick="editDay=${d};render()">${DAYS[d]}</button>`).join('')}</div><div class="space"></div><h3>${FULL[editDay]}</h3>${templateForDay(editDay).length?templateForDay(editDay).map(t=>`<div class="entry row between"><strong>${esc(t.name)} ${t.unilateral?'· 👐 По черзі':''}</strong><button class="small danger" onclick="removeTemplate('${t.id}')">Видалити</button></div>`).join(''):'<div class="empty">На цей день вправ поки немає</div>'}<div class="row" style="margin-top:14px"><div class="field"><label>Назва вправи</label><input id="newExercise" maxlength="90" placeholder="Наприклад: жим гантелей"></div><button class="primary" onclick="addTemplate()">Додати</button></div><label class="row"><input id="templateUnilateral" type="checkbox" style="width:auto"> Вправа по черзі на праву й ліву руку</label><div class="shortcut">↵ Enter, щоб швидко додати вправу</div><p><small>Розклад задає вправи за днями тижня. Кількість підходів, повторення та вагу записуй під час тренування.</small></p></section>`}
function start(mode){if(active&&!confirm('Поточне незавершене тренування буде замінено. Продовжити?'))return;const day=new Date().getDay();active={id:uid(),date:today(),started:new Date().toISOString(),finished:null,title:mode==='plan'?`Тренування: ${FULL[day]}`:'Вільне тренування',mode,plannedExercises:mode==='plan'?templateForDay(day).map(t=>({name:t.name,id:t.id})):[],exercises:(mode==='plan'?templateForDay(day):[]).map(t=>({id:uid(),name:t.name,unilateral:!!t.unilateral,sets:[{id:uid(),weight:'',reps:'',done:false}]}))};saveDraft();tab='workout';render()}
let restEndsAt=0,restDuration=90,restTicker=null;
function timerLabel(sec){return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function readRest(){try{const x=JSON.parse(localStorage.getItem('gym-rest-v1')||'{}');restDuration=[60,90,120,180].includes(Number(x.duration))?Number(x.duration):90;restEndsAt=Number(x.end)||0}catch(_){restDuration=90;restEndsAt=0}}
function persistRest(){try{localStorage.setItem('gym-rest-v1',JSON.stringify({duration:restDuration,end:restEndsAt}))}catch(_){}}
let soundEnabled=localStorage.getItem('gym-sounds-v1')==='1',soundContext=null,restEndSignalled=0;
function beep(frequency=740,second=false){if(!soundEnabled)return;try{const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return;if(!soundContext)soundContext=new AudioCtx();if(soundContext.state==='suspended')soundContext.resume().catch(()=>{});const base=soundContext.currentTime;const pattern=second?[[0,frequency,.25],[.33,frequency+160,.25],[.68,frequency+250,.42]]:[[0,frequency,.24],[.32,frequency+100,.22]];for(const [delay,hz,duration] of pattern){const osc=soundContext.createOscillator(),gain=soundContext.createGain();osc.type='square';osc.frequency.value=hz;gain.gain.setValueAtTime(.0001,base+delay);gain.gain.linearRampToValueAtTime(.28,base+delay+.035);gain.gain.setValueAtTime(.28,base+delay+duration-.04);gain.gain.linearRampToValueAtTime(.0001,base+delay+duration);osc.connect(gain);gain.connect(soundContext.destination);osc.start(base+delay);osc.stop(base+delay+duration+.01)}}catch(e){console.warn('Audio unavailable',e)}}function testTimerSound(){if(!soundEnabled){soundEnabled=true;localStorage.setItem('gym-sounds-v1','1');render()}beep(880,true)}
function toggleSounds(){soundEnabled=!soundEnabled;localStorage.setItem('gym-sounds-v1',soundEnabled?'1':'0');if(soundEnabled)beep(620);render()}
function startRest(){restEndsAt=Date.now()+restDuration*1000;restEndSignalled=0;persistRest();beep(500);updateRestUI()}
function stopRest(){restEndsAt=0;persistRest();updateRestUI()}

function updateRestUI(){if(restEndsAt&&Date.now()>=restEndsAt&&!restEndSignalled){restEndSignalled=1;if(Date.now()-restEndsAt<120000)beep(900,true)}const v=document.getElementById('restClock');if(!v)return;const rem=Math.max(0,Math.ceil((restEndsAt-Date.now())/1000));v.textContent=timerLabel(rem);const p=document.getElementById('restProgress');if(p)p.style.width=(rem?Math.min(100,100*(restDuration-rem)/restDuration):0)+'%';const status=document.getElementById('restStatus');if(status)status.textContent=rem?'Відпочинок триває':restEndsAt?'Час відпочинку минув':'Таймер готовий'}
readRest();restTicker=setInterval(updateRestUI,1000);
function addExercise(){if(!active)return;const i=document.getElementById('newSessionExercise');const name=i.value.trim();if(!name)return;active.exercises.push({id:uid(),name,unilateral:false,sets:[{id:uid(),weight:'',reps:'',done:false}]});saveDraft();render();document.getElementById('newSessionExercise')?.focus()}function addSet(e){const ss=active.exercises[e].sets;const prev=ss.at(-1);ss.push({id:uid(),weight:prev?.weight||'',reps:prev?.reps||'',done:false,leftReps:prev?.leftReps||prev?.reps||'',rightReps:prev?.rightReps||prev?.reps||'',leftDone:false,rightDone:false});saveDraft();render()}function dropSet(e,s){active.exercises[e].sets.splice(s,1);saveDraft();render()}function dropExercise(e){if(confirm('Прибрати вправу з цього тренування?')){active.exercises.splice(e,1);saveDraft();render()}}function editSet(e,s,k,val){const st=active.exercises[e].sets[s];const before=st.done;st[k]=k==='done'?val:val.replace(/[^0-9.,]/g,'').replace(',','.').slice(0,8);saveDraft();if(k==='done'){if(val&&!before)startRest();render()}}function completedSets(ex){return (ex.sets||[]).filter(st=>setComplete(st,ex)).length}
function sessionStatus(s){const ex=s.exercises||[];const done=ex.reduce((n,e)=>n+completedSets(e),0);if(!done)return 'none';const allSets=ex.every(e=>(e.sets||[]).length>0&&(e.sets||[]).every(st=>setComplete(st,e)));const planned=Array.isArray(s.plannedExercises)?s.plannedExercises:[];const allPlanned=(!planned.length||planned.every(p=>ex.some(e=>e.name===p.name && completedSets(e)>0)));return allSets&&allPlanned?'full':'partial'}
function beginEditingSession(id){const record=state.sessions.find(s=>s.id===id);if(!record)return;if(active&&!confirm('Поточна чернетка буде замінена редагуванням цього запису. Продовжити?'))return;active=JSON.parse(JSON.stringify(record));active.editingExisting=true;saveDraft();tab='workout';render()}
function carryRemaining(id){const original=state.sessions.find(s=>s.id===id);if(!original)return;const pending=(original.exercises||[]).map(e=>({...e,sets:(e.sets||[]).filter(st=>!setComplete(st,e)).map(st=>({...st,id:uid()}))})).filter(e=>e.sets.length);if(!pending.length){alert('Невиконаних підходів немає.');return}if(active&&!confirm('Поточна чернетка буде замінена перенесеними вправами. Продовжити?'))return;active={id:uid(),date:today(),started:new Date().toISOString(),finished:null,title:'Перенесені вправи',mode:'free',plannedExercises:[],exercises:pending};saveDraft();tab='workout';render()}
function draftDuplicate(){if(!active||active.editingExisting)return null;return state.sessions.find(s=>s.id===active.id)||null}
function discardDuplicateDraft(){if(!draftDuplicate())return; if(!confirm('Завершене тренування вже є в історії. Прибрати лише цю локальну чернетку? Збережений запис залишиться без змін.'))return;active=null;stopRest();saveDraft();render()}
function checkDraftNotice(){const duplicate=draftDuplicate();if(duplicate)return `<div class="notice" style="margin-bottom:14px;border:1px solid #d7a14e;background:#36291b;color:#ffe1ac"><strong>Це тренування вже збережене в історії.</strong><p style="margin:9px 0">Збігається ідентифікатор тренування. Не завершуй його повторно, щоб випадково не змінити готовий запис.</p><button class="small" onclick="discardDuplicateDraft()">Прибрати зайву чернетку</button><button class="small" onclick="nav('history')">Переглянути історію</button></div>`;return `<div class="notice" style="margin-bottom:14px">Чернетка: тренування ще не завершене й не додане до історії.</div>`}
function saveSession(){if(!active)return;if(draftDuplicate()){alert('Це тренування вже є в історії. Перевір запис або прибери зайву чернетку. Дані не змінено.');return;}const completed=active.exercises.reduce((n,e)=>n+e.sets.filter(s=>setComplete(s,e)).length,0);if(!completed&&!confirm('Немає відмічених підходів. Все одно завершити?'))return;active.finished=new Date().toISOString();const record=JSON.parse(JSON.stringify(active));delete record.editingExisting;record.status=sessionStatus(record);const at=state.sessions.findIndex(x=>x.id===record.id);if(at>=0)state.sessions[at]=record;else state.sessions.push(record);save();active=null;stopRest();saveDraft();tab='history';render()}function workout(){if(!active)return `<section class="panel"><h2>Почати тренування</h2><p>Вибери вправи з розкладу на сьогодні або склади своє тренування з нуля.</p><div class="row"><button class="primary" onclick="start('plan')">За розкладом</button><button onclick="start('free')">Вільне тренування</button></div></section>`;return `<section class="panel">${checkDraftNotice()}${active.date!==today()?`<div class="notice" style="margin-bottom:14px">Це тренування розпочато ${dateFmt(active.date)}. Воно залишилося чернеткою після зміни дня. Можеш продовжити або завершити лише виконані підходи. Дата початку не змінюється.</div>`:""}<div class="row between"><h2>${esc(active.title)}</h2><button class="small danger" onclick="if(confirm('Скасувати незавершене тренування?')){active=null;stopRest();saveDraft();render()}">Скасувати</button></div><p>${dateFmt(active.date)} · Відмічай кожен виконаний підхід</p><div class="statusrow"><span class="pill">✓ ${active.exercises.reduce((n,e)=>n+e.sets.filter(s=>setComplete(s,e)).length,0)} виконано</span><small>${active.exercises.reduce((n,e)=>n+e.sets.length,0)} підходів у плані</small></div><div class="progressline"><div style="width:${Math.round(100*active.exercises.reduce((n,e)=>n+e.sets.filter(s=>setComplete(s,e)).length,0)/Math.max(1,active.exercises.reduce((n,e)=>n+e.sets.length,0)))}%"></div></div><div class="rest-card"><div class="row between"><div><span class="eyebrow">ВІДПОЧИНОК МІЖ ПІДХОДАМИ</span><div id="restClock" class="rest-clock">00:00</div><small id="restStatus">Таймер готовий</small></div><button class="small" onclick="stopRest()">Скинути</button></div><div class="progressline"><div id="restProgress" style="width:0%"></div></div><div class="rest-presets">${[60,90,120,180].map(n=>`<button class="small ${restDuration===n?'rest-selected':''}" onclick="chooseRest(${n})">${n/60===1?'1 хв':n/60===1.5?'1:30':(n/60)+' хв'}</button>`).join('')}<button class="small primary" onclick="startRest()">▶ Старт</button></div><div class="row" style="margin-top:12px"><button class="small" onclick="toggleSounds()">${soundEnabled?'🔊 Звук увімкнено':'🔇 Увімкнути звук'}</button><button class="small" onclick="testTimerSound()">♪ Перевірити звук</button><small>Сигнал на початку й наприкінці відпочинку. На заблокованому телефоні звук не гарантований.</small></div></div>${active.exercises.map((e,i)=>`<div class="exercise"><div class="row between"><strong>${esc(e.name)}</strong><button class="small danger" onclick="dropExercise(${i})">✕</button></div><label class="row unilateral-switch"><input type="checkbox" ${e.unilateral?'checked':''} onchange="toggleUnilateral(${i})"> По черзі на обидві руки</label>${e.unilateral?`<div class="side-hint">Одна пара «права + ліва» = один підхід. Таймер запуститься після обох рук.</div>${e.sets.map((s,j)=>`<div class="paired-set"><div class="row between"><strong>Підхід ${j+1}</strong><button class="small danger" onclick="dropSet(${i},${j})">×</button></div><div class="field"><label>Вага гантелі, кг</label><input inputmode="decimal" value="${esc(s.weight)}" oninput="editSet(${i},${j},'weight',this.value)"></div><div class="side-grid">${[['right','Права'],['left','Ліва']].map(([side,label])=>`<div class="side-card ${s[side+'Done']?'side-complete':''}"><strong>${label}</strong><label>Повторення</label><input inputmode="numeric" value="${esc(s[side+'Reps']??s.reps??'')}" oninput="editSide(${i},${j},'${side}','reps',this.value)"><label class="row"><input type="checkbox" ${s[side+'Done']?'checked':''} onchange="editSide(${i},${j},'${side}','done',this.checked)"> Готово</label></div>`).join('')}</div></div>`).join('')}`:`<div class="set muted sethead"><span>№</span><span style="text-align:center">Вага, кг</span><span style="text-align:center">Повт.</span><span>✓</span><span></span></div>${e.sets.map((s,j)=>`<div class="set ${s.done?'set-done':''}"><span>${j+1}</span><input inputmode="decimal" aria-label="Вага" value="${esc(s.weight)}" oninput="editSet(${i},${j},'weight',this.value)"><input inputmode="numeric" aria-label="Повторення" value="${esc(s.reps)}" oninput="editSet(${i},${j},'reps',this.value)"><input type="checkbox" aria-label="Виконано" ${s.done?'checked':''} onchange="editSet(${i},${j},'done',this.checked)"><button class="small danger" title="Видалити підхід" onclick="dropSet(${i},${j})">×</button></div>`).join('')}`}<button class="small" onclick="addSet(${i})">＋ Підхід</button></div>`).join('')}<div class="row"><div class="field"><label>Нова вправа</label><input id="newSessionExercise" maxlength="90" placeholder="Назва вправи"></div><button onclick="addExercise()">Додати</button></div><div class="shortcut">↵ Enter, щоб додати вправу</div><div class="space"></div><div class="stickyfinish"><button class="primary" onclick="saveSession()">✓ Завершити й зберегти виконане</button></div><p><small>Чернетка автоматично зберігається у цьому браузері після змін.</small></p></section>`}
function delSession(id){if(!confirm('Назавжди видалити цей запис тренування?'))return;state.sessions=state.sessions.filter(x=>x.id!==id);save();render()}function history(){const items=[...state.sessions].filter(s=>s.finished).sort((a,b)=>String(b.finished).localeCompare(String(a.finished)));return `<section class="panel"><h2>Історія тренувань</h2>${!items.length?'<div class="empty">Поки немає завершених тренувань</div>':items.map(s=>{const status=sessionStatus(s);const word=status==='full'?'🟢 Повністю':status==='partial'?'🟡 Частково':'Без виконаних підходів';return `<details class="entry"><summary><strong>${esc(s.title)}</strong> <small> · ${dateFmt(s.date)} · ${word}</small></summary>${(s.exercises||[]).map(e=>`<h3 style="margin-top:14px">${esc(e.name)}</h3>${(e.sets||[]).map((st,i)=>`<div class="muted">${i+1}. ${esc(st.weight||'0')} кг × ${e.unilateral?'ліва '+esc(st.leftReps||'0')+' / права '+esc(st.rightReps||'0'):esc(st.reps||'0')} ${setComplete(st,e)?'✓':'(не виконано)'}</div>`).join('')}`).join('')}<div class="space"></div><div class="row"><button class="small" onclick="beginEditingSession('${s.id}')">Редагувати</button><button class="small" onclick="carryRemaining('${s.id}')">Перенести невиконане</button><button class="small danger" onclick="delSession('${s.id}')">Видалити запис</button></div></details>`}).join('')}</section>`}

let progressExercise='',progressPeriod='90',progressMetric='weight';
function seriesList(){return state.sessions.filter(s=>s.finished&&Array.isArray(s.exercises)).flatMap(s=>s.exercises.map(e=>({date:s.date,name:(e.name||'').trim(),sets:(e.sets||[]).filter(x=>setComplete(x,e)),unilateral:!!e.unilateral}))).filter(x=>x.name&&x.date)}
function chooseProgress(k,v){if(k==='exercise')progressExercise=v;if(k==='period')progressPeriod=v;if(k==='metric')progressMetric=v;render()}
function getProgressPoints(){let raw=seriesList().filter(x=>x.name===progressExercise);const days=Number(progressPeriod);if(days){let cutoff=new Date();cutoff.setHours(0,0,0,0);cutoff.setDate(cutoff.getDate()-days+1);raw=raw.filter(x=>new Date(x.date+'T12:00:00')>=cutoff)}const grouped={};raw.forEach(item=>{const val=progressMetric==='weight'?Math.max(0,...item.sets.map(x=>Number(x.weight)||0)):progressMetric==='reps'?Math.max(0,...item.sets.map(x=>item.unilateral?Math.max(Number(x.leftReps)||0,Number(x.rightReps)||0):(Number(x.reps)||0))):item.sets.reduce((sum,x)=>sum+setVolume(x,item),0);if(!item.sets.length)return;if(!grouped[item.date])grouped[item.date]=[];grouped[item.date].push(val)});return Object.entries(grouped).sort((a,b)=>a[0].localeCompare(b[0])).map(([date,values])=>({date,value:progressMetric==='volume'?values.reduce((a,b)=>a+b,0):Math.max(...values)}))}
function chartSvg(data,unit){if(!data.length)return '<div class="empty">За цей проміжок ще немає виконаних підходів. Запиши тренування, щоб побачити свій прогрес.</div>';const W=800,H=300,L=64,R=18,T=20,B=46,PW=W-L-R,PH=H-T-B,values=data.map(x=>x.value),min=Math.min(0,...values),max=Math.max(1,...values)*1.12,range=max-min;const x=i=>L+(data.length===1?PW/2:i*PW/(data.length-1)),y=v=>T+PH-(v-min)/range*PH,pts=data.map((d,i)=>[x(i),y(d.value)]);const line=pts.map((a,i)=>(i?'L':'M')+a[0].toFixed(1)+' '+a[1].toFixed(1)).join(' ');const area=line+` L ${pts.at(-1)[0]} ${T+PH} L ${pts[0][0]} ${T+PH} Z`;const grids=Array.from({length:5},(_,i)=>{const v=min+(max-min)*i/4,Y=y(v);return `<line x1="${L}" y1="${Y}" x2="${W-R}" y2="${Y}" stroke="#304158" stroke-dasharray="4 6"/><text x="${L-10}" y="${Y+4}" fill="#8ba0bb" text-anchor="end" font-size="13">${Math.round(v).toLocaleString('uk-UA')}</text>`}).join('');const marks=[...new Set([0,Math.floor((data.length-1)/2),data.length-1])].map(i=>`<text x="${x(i)}" y="${H-12}" text-anchor="middle" fill="#9baec7" font-size="13">${new Date(data[i].date+'T12:00:00').toLocaleDateString('uk-UA',{day:'2-digit',month:'short'})}</text>`).join('');const circles=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${data.length>50?3:5}" fill="#b5d6ff" stroke="#13253a" stroke-width="2"><title>${esc(dateFmt(data[i].date))}: ${data[i].value.toLocaleString('uk-UA')} ${unit}</title></circle>`).join('');return `<div class="chart-wrap"><svg class="analytics-chart" role="img" aria-label="Графік прогресу, ${data.length} дат" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#70aeff" stop-opacity=".33"/><stop offset="1" stop-color="#70aeff" stop-opacity="0"/></linearGradient></defs>${grids}<path d="${area}" fill="url(#chartFill)"/><path d="${line}" fill="none" stroke="#9ec6ff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>${circles}${marks}</svg><div class="chart-legend">${unit} · ${data.length} дат із записами</div></div>`}
function progress(){const names=[...new Set(seriesList().map(x=>x.name))].sort((a,b)=>a.localeCompare(b,'uk'));if(!names.length)return `<section class="panel"><h2>📈 Прогрес</h2><p>Тут будуть графіки робочої ваги, повторень і загального обсягу для кожної вправи.</p><div class="empty">Спочатку заверши тренування й відміть виконані підходи. Після цього зʼявляться графіки.</div></section>`;if(!names.includes(progressExercise))progressExercise=names[0];const periods=[['30','30 днів'],['90','3 місяці'],['180','6 місяців'],['365','Рік'],['0','Увесь час']];const metrics=[['weight','Макс. вага'],['reps','Макс. повторення'],['volume','Обсяг']];const points=getProgressPoints(),unit=progressMetric==='reps'?'повт.':'кг';const vals=points.map(x=>x.value);const first=vals[0]||0,last=vals.at(-1)||0,delta=last-first;return `<section class="panel"><h2>📈 Твій прогрес</h2><p>Обери вправу, показник та часовий проміжок. Графік використовує лише відмічені виконані підходи.</p><div class="analytics-controls"><div><label for="progressExercise">Вправа</label><select id="progressExercise" onchange="chooseProgress('exercise',this.value)">${names.map(n=>`<option value="${esc(n)}" ${n===progressExercise?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div><label for="progressPeriod">Період</label><select id="progressPeriod" onchange="chooseProgress('period',this.value)">${periods.map(([v,l])=>`<option value="${v}" ${v===progressPeriod?'selected':''}>${l}</option>`).join('')}</select></div><div><label for="progressMetric">Показник</label><select id="progressMetric" onchange="chooseProgress('metric',this.value)">${metrics.map(([v,l])=>`<option value="${v}" ${v===progressMetric?'selected':''}>${l}</option>`).join('')}</select></div></div><div class="metric-row"><div class="metric"><span>Перший результат</span><strong>${points.length?first.toLocaleString('uk-UA'):'—'}</strong></div><div class="metric"><span>Останній результат</span><strong>${points.length?last.toLocaleString('uk-UA'):'—'}</strong></div><div class="metric"><span>Зміна</span><strong style="color:${delta>=0?'#78e0b9':'#ffabb4'}">${points.length?(delta>0?'+':'')+delta.toLocaleString('uk-UA'):'—'}</strong></div></div>${chartSvg(points,unit)}<p class="chart-caption">${progressMetric==='weight'?'Найбільша вага серед виконаних підходів за день.':progressMetric==='reps'?'Найбільша кількість повторень за один виконаний підхід за день.':'Сума вага × повторення всіх виконаних підходів вправи за день.'} Зміна порівнює перший та останній запис у вибраному періоді.</p></section>`}

let calendarOffset=0,compareExercise='';

function insights(){
 const sessions=state.sessions.filter(s=>s.finished&&/^\d{4}-\d\d-\d\d$/.test(s.date)).sort((a,b)=>a.date.localeCompare(b.date));
 const uniqueDates=[...new Set(sessions.map(s=>s.date))].sort();
 const todayDate=today();let streak=0;
 const daysAgo=n=>{let d=new Date();d.setDate(d.getDate()-n);return d.toLocaleDateString('en-CA')};
 const datesSet=new Set(uniqueDates);const dateStatuses=new Map();for(const session of sessions){const status=sessionStatus(session);if(status==='full'||(!dateStatuses.has(session.date)&&status==='partial'))dateStatuses.set(session.date,status)}let start=datesSet.has(daysAgo(0))?0:1;while(datesSet.has(daysAgo(start+streak)))streak++;
 const recordMap=new Map(),byExercise=new Map();
 for(const session of sessions){for(const ex of session.exercises||[]){const name=(ex.name||'').trim();if(!name)continue;const sets=(ex.sets||[]).filter(x=>x.done);if(!sets.length)continue;const maxWeight=Math.max(...sets.map(x=>Number(x.weight)||0));const maxReps=Math.max(...sets.map(x=>ex.unilateral?Math.max(Number(x.leftReps)||0,Number(x.rightReps)||0):(Number(x.reps)||0)));const volume=sets.reduce((sum,x)=>sum+setVolume(x,ex),0);const old=recordMap.get(name);if(!old||maxWeight>old.weight)recordMap.set(name,{weight:maxWeight,date:session.date});if(!byExercise.has(name))byExercise.set(name,[]);byExercise.get(name).push({date:session.date,weight:maxWeight,reps:maxReps,volume});}}
 const month=new Date();month.setDate(1);month.setMonth(month.getMonth()+calendarOffset);const y=month.getFullYear(),m=month.getMonth(),monthName=month.toLocaleDateString('uk-UA',{month:'long',year:'numeric'});const firstDay=(month.getDay()+6)%7,monthLen=new Date(y,m+1,0).getDate();const cells=Array.from({length:Math.ceil((firstDay+monthLen)/7)*7},(_,i)=>{const day=i-firstDay+1;if(day<1||day>monthLen)return '<div class="calendar-day outside"></div>';const key=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;const status=dateStatuses.get(key)||'',done=!!status,isToday=key===todayDate;return `<button type="button" class="calendar-day ${status==='full'?'done':status==='partial'?'partial':''} ${isToday?'today':''} ${selectedCalendarDate===key?'calendar-picked':''}" onclick="showCalendarDay('${key}')" aria-label="${day} ${monthName}${done?' · тренування записано':''}" title="Переглянути ${key}">${day}${done?'<span class="dot"></span>':''}</button>`}).join('');
 const names=[...byExercise.keys()].sort((a,b)=>a.localeCompare(b,'uk'));if(!names.includes(compareExercise))compareExercise=names[0]||'';const comparison=(byExercise.get(compareExercise)||[]).sort((a,b)=>a.date.localeCompare(b.date)).slice(-2);const previous=comparison.length===2?comparison[0]:null,current=comparison.at(-1);const difference=(a,b,unit)=>`${b-a>0?'+':''}${Number((b-a).toFixed(1)).toLocaleString('uk-UA')} ${unit}`;
 return `<section class="panel"><h2>🏆 Досягнення та активність</h2><p>Календар, рекорди й порівняння твоїх останніх результатів. Враховуються лише завершені тренування та виконані підходи.</p><div class="insight-cards"><div class="insight-card"><span class="cap">Днів із тренуваннями</span><span class="big">${uniqueDates.length}</span><small>за весь час</small></div><div class="insight-card"><span class="cap">Серія активності</span><span class="big">${streak} дн.</span><small>поспіль до сьогодні / вчора</small></div><div class="insight-card"><span class="cap">Вправ із рекордами</span><span class="big">${recordMap.size}</span><small>за всі записи</small></div></div></section>

}

function download(){const blob=new Blob([JSON.stringify({...state,activeDraft:active||null,exported:new Date().toISOString()},null,2)],{type:'application/json'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='gym-tracker-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}async function checkForUpdates(){try{if('serviceWorker' in navigator){const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update()}if('caches' in window){for(const key of await caches.keys())if(key.startsWith('gym-tracker-shell-'))await caches.delete(key)}}catch(_){}location.href='./?refresh='+Date.now()}function settings(){return `<section class="panel"><h2>Твої дані</h2><p>Записи зберігаються локально на цьому пристрої у браузері (localStorage та, за підтримки, IndexedDB). На телефоні та ПК це окремі бази. Для перенесення скористайся експортом та імпортом. Імпорт замінює поточні дані, а не об'єднує їх.</p><p class="notice">Версія застосунку: <button class="version-secret" onclick="tapVersion(event)" oncontextmenu="return false" title="Версія програми" aria-label="Номер версії застосунку">v${APP_VERSION}</button> · Сховище: ${esc(storageMode)}. Локальні дані зберігаються на пристрої.</p><div class="settings-actions"><button onclick="checkForUpdates()">⟳ Перевірити оновлення</button><button class="primary" onclick="download()">↓ Завантажити резервну копію</button><button onclick="document.getElementById('importFile').click()">↑ Імпортувати JSON</button></div><p><small>Перевірка оновлення не повинна стирати локальні записи, оскільки вони зберігаються окремо від кешу оболонки застосунку.</small></p><p><small>Рекомендація: експортуй дані після важливих тренувань. Приватний режим браузера не підходить для постійного зберігання.</small></p></section>${cloudUnlocked?cloudPanel():''}` }
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&active){saveDraft();if(tab==='workout')render()}});setInterval(()=>{if(active&&active.date!==today()&&!document.hidden){saveDraft();if(tab==='workout')render()}},60000);document.getElementById('app').addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing||e.shiftKey)return;if(e.target.id==='newExercise'){e.preventDefault();addTemplate()}else if(e.target.id==='newSessionExercise'){e.preventDefault();addExercise()}});document.getElementById('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(!Array.isArray(d.templates)||!Array.isArray(d.sessions)||d.templates.length>5000||d.sessions.length>20000)throw Error('Невірний формат');if(!confirm('Імпорт повністю замінить поточні записи. Продовжити?'))return;state={version:1,templates:d.templates,sessions:d.sessions,bodyWeights:Array.isArray(d.bodyWeights)?d.bodyWeights:[],measurements:Array.isArray(d.measurements)?d.measurements:[]};save();active=d.activeDraft&&Array.isArray(d.activeDraft.exercises)?d.activeDraft:null;saveDraft();tab='home';render();alert('Імпортовано!')}catch(err){alert('Не вдалося імпортувати файл: '+err.message)}finally{e.target.value=''}});if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});initStore();

let cloudUnlocked=false, versionTaps=0, versionTapTime=0;
function tapVersion(ev){if(ev){ev.preventDefault();ev.stopPropagation()}const now=Date.now();versionTaps=now-versionTapTime<2200?versionTaps+1:1;versionTapTime=now;if(versionTaps>=3){versionTaps=0;cloudUnlocked=!cloudUnlocked;render();if(cloudUnlocked)ensureFirebase()}}
let syncTimer=null,syncRunning=false,syncQueued=false,syncLoaded=false,syncUnsubscribe=null,syncState='Лише локально';
function scheduleAutoSync(){if(!cloudUser||!fbReady||!syncLoaded)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>autoSync(),1300)}
function syncLabel(t){syncState=t;const el=document.getElementById('syncState');if(el)el.textContent=t}
function mergedArray(a,b,key){const out=new Map();for(const item of [...(Array.isArray(b)?b:[]),...(Array.isArray(a)?a:[])]){if(item&&typeof item==='object')out.set(String(key(item)),item)}return [...out.values()]}
function mergedState(local,remote){remote=remote||{};return {version:1,
 sessions:mergedArray(local.sessions,remote.sessions,x=>x.id||JSON.stringify(x)),
 templates:mergedArray(local.templates,remote.templates,x=>x.id||`${x.day}:${x.name}`),
 bodyWeights:mergedArray(local.bodyWeights,remote.bodyWeights,x=>x.id||x.date),
 measurements:mergedArray(local.measurements,remote.measurements,x=>x.id||`${x.date}:${x.metric||x.part||JSON.stringify(x)}`)} }
function isOwnerAccount(){return !!cloudUser&&(!FRIENDS_OWNER_UID||cloudUser.uid===FRIENDS_OWNER_UID)}
function syncDocument(){return fbDb.collection('users').doc(cloudUser.uid).collection('backups').doc('sync-v1')}
async function autoSync(){if(!fbReady||!cloudUser||!syncLoaded)return;if(!navigator.onLine){syncLabel('Очікує інтернету');return}if(syncRunning){syncQueued=true;return}syncRunning=true;syncLabel('Синхронізація…');try{const ref=syncDocument();let combined;await fbDb.runTransaction(async tx=>{const doc=await tx.get(ref);combined=mergedState(state,doc.exists?doc.data().state:null);tx.set(ref,{state:combined,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),schema:1})});const updated=JSON.stringify(state)!==JSON.stringify(combined);state=mergedState(combined,state);if(updated){localStorage.setItem(KEY,JSON.stringify(state));persistDB();render()}syncLabel('Синхронізовано ✓')}catch(e){syncLabel('Помилка синхронізації: '+e.message)}finally{syncRunning=false;if(syncQueued){syncQueued=false;scheduleAutoSync()}}}
async function startAutoSync(){if(!fbReady||!cloudUser)return;syncLoaded=true;await autoSync();if(syncUnsubscribe)syncUnsubscribe();syncUnsubscribe=syncDocument().onSnapshot(snap=>{if(!snap.exists||!syncLoaded)return;const merged=mergedState(state,snap.data().state);if(JSON.stringify(merged)!==JSON.stringify(state)){state=merged;localStorage.setItem(KEY,JSON.stringify(state));persistDB();render();scheduleAutoSync()}},err=>syncLabel('Помилка отримання: '+err.message))}
function stopAutoSync(){syncLoaded=false;clearTimeout(syncTimer);if(syncUnsubscribe){syncUnsubscribe();syncUnsubscribe=null}syncLabel('Лише локально')}
window.addEventListener('online',()=>{if(syncLoaded)scheduleAutoSync()});
// Optional cloud backup, disabled until owner configures Firebase and a user signs in.
let fbReady=false,fbAuth=null,fbDb=null,cloudUser=null,cloudBusy=false;
const FRIENDS_OWNER_UID=String(window.GYM_FRIENDS_OWNER_UID||'').trim();
const CLOUD_CONFIG=window.GYM_FIREBASE_CONFIG || null;
function cloudPanel(){return `<section class="panel"><h2>☁️ Хмарне сховище</h2><p>Без входу все зберігається тільки на пристрої. Для власника можна ввімкнути Google-вхід і Firestore. Друзі можуть не входити.</p><p class="notice" id="cloudStatus">${!CLOUD_CONFIG?.apiKey?'Firebase ще не налаштований. Додай свої параметри у firebase-config.js.':cloudUser?'Підключено: '+esc(cloudUser.email||'Google'):'Firebase налаштований, але вхід не виконано.'}</p><div class="settings-actions">${cloudUser?`<button onclick="cloudSignOut()">Вийти з хмари</button>${isOwnerAccount()?`<button class="primary" onclick="cloudUpload()" ${cloudBusy?'disabled':''}>↑ Зберегти копію в хмарі</button><button onclick="cloudDownload()" ${cloudBusy?'disabled':''}>↓ Відновити з хмари</button>`:''}`:`<button onclick="cloudSignIn()" ${!CLOUD_CONFIG?.apiKey?'disabled':''}>Увійти через Google</button>`}</div><p><strong>Стан синхронізації: </strong><span id="syncState">${esc(syncState)}</span></p><div class="row"><button onclick="autoSync()" ${!isOwnerAccount()?'disabled':''}>↻ Синхронізувати зараз</button></div><p><small>Автоматично об’єднуються записи з різними ідентифікаторами. Видалення та одночасні правки одного запису поки не синхронізуються надійно. Ручна резервна копія зберігається окремо. Автоматична синхронізація запускається для вже авторизованого користувача. Ручне відновлення замінює локальні записи, тому перед ним експортуй JSON.</small></p></section>`}
function cloudStatus(message){const n=document.getElementById('cloudStatus');if(n)n.textContent=message}
function ensureFirebase(){if(fbReady)return true;if(!CLOUD_CONFIG?.apiKey){cloudStatus('Немає налаштувань Firebase.');return false}if(!window.firebase){cloudStatus('Немає доступу до бібліотеки Firebase. Перевір інтернет.');return false}try{if(!firebase.apps.length)firebase.initializeApp(CLOUD_CONFIG);fbAuth=firebase.auth();fbDb=firebase.firestore();fbAuth.onAuthStateChanged(user=>{const prev=cloudUser?.uid;cloudUser=user;if(!user){stopAutoSync()}else if(isOwnerAccount()&&(prev!==user.uid||!syncLoaded)){startAutoSync()}else if(!isOwnerAccount()){stopAutoSync()}if(tab==='settings'||tab==='friends')render();if(user&&FRIENDS_OWNER_UID)refreshFriends()});fbReady=true;return true}catch(e){cloudStatus('Firebase: '+e.message);return false}}

async function cloudSignOut(){if(fbAuth){stopAutoSync();await fbAuth.signOut();cloudUser=null;render()}}
function cloudRef(){return fbDb.collection('users').doc(cloudUser.uid).collection('backups').doc('current')}
async function cloudUpload(){if(!cloudUser||cloudBusy||!isOwnerAccount())return;const all={state:JSON.parse(JSON.stringify(state)),activeDraft:active||null,updatedAt:new Date().toISOString(),schema:1};if(!confirm('Записати поточні дані цього пристрою в хмару? Це ЗАМІНИТЬ попередню хмарну копію.'))return;cloudBusy=true;try{cloudStatus('Записую...');await cloudRef().set(all);cloudStatus('Хмарну копію збережено: '+new Date().toLocaleString('uk-UA'))}catch(e){cloudStatus('Не вдалося записати: '+e.message)}finally{cloudBusy=false}}
async function cloudDownload(){if(!cloudUser||cloudBusy||!isOwnerAccount())return;cloudBusy=true;try{cloudStatus('Читаю хмарну копію...');const doc=await cloudRef().get();if(!doc.exists){cloudStatus('У хмарі ще немає копії.');return}const data=doc.data(),loaded=data.state;if(!loaded||!Array.isArray(loaded.sessions)||!Array.isArray(loaded.templates))throw Error('Неправильний формат хмарної копії');if(!confirm('УВАГА: Відновлення ЗАМІНИТЬ локальні тренування, вагу й заміри на цьому пристрої. Спочатку експортуй JSON. Продовжити?')){cloudStatus('Відновлення скасоване');return}state={version:1,templates:loaded.templates,sessions:loaded.sessions,bodyWeights:Array.isArray(loaded.bodyWeights)?loaded.bodyWeights:[],measurements:Array.isArray(loaded.measurements)?loaded.measurements:[]};active=data.activeDraft&&Array.isArray(data.activeDraft.exercises)?data.activeDraft:null;save();saveDraft();tab='settings';render();cloudStatus('Відновлено з хмари.')}catch(e){cloudStatus('Не вдалося відновити: '+e.message)}finally{cloudBusy=false}}

// Gym Friends: social stats only. No sessions, drafts, body data or notes are uploaded.
let socialStatus='',socialMembers=[],socialLoaded=false;
function socialRef(){return fbDb.collection('gymFriends').doc('main')}
function safeNumeric(n){return Number.isFinite(Number(n))?Math.max(0,Math.min(Number(n),1000000)):0}
function socialStats(){
 const sessions=state.sessions.filter(x=>x.finished),days=new Set(sessions.map(x=>x.date));
 const records=new Map();let setsDone=0;
 for(const session of sessions)for(const ex of session.exercises||[]){let name=String(ex.name||'').trim().slice(0,70);if(!name)continue;
  for(const set of ex.sets||[]){if(!setComplete(set,ex))continue;setsDone++;
   const w=safeNumeric(set.weight),reps=safeNumeric(ex.unilateral?Math.max(Number(set.leftReps)||0,Number(set.rightReps)||0):set.reps);
   const old=records.get(name);if(!old||w>old.weight||(w===old.weight&&reps>old.reps))records.set(name,{name,weight:w,reps});
  }
 }
 return {sessions:sessions.length,activeDays:days.size,setsDone,records:[...records.values()].sort((a,b)=>a.name.localeCompare(b.name,'uk')).slice(0,100)};
}
function socialNote(t){socialStatus=t;if(tab==='friends')render()}
async function refreshFriends(){if(!fbReady||!cloudUser||!FRIENDS_OWNER_UID)return;
 try{const [m,records]=await Promise.all([socialRef().collection('members').get(),socialRef().collection('records').get()]);
  socialMembers=m.docs.map(d=>({id:d.id,...d.data(),stats:records.docs.find(r=>r.id===d.id)?.data()||null}));socialLoaded=true;socialNote('Оновлено');
 }catch(e){socialNote('Немає доступу або помилка: '+e.message)} }
async function publishSocial(){if(!fbReady||!cloudUser||!FRIENDS_OWNER_UID||!(cloudUser.uid===FRIENDS_OWNER_UID||socialMembers.some(m=>m.id===cloudUser.uid&&m.enabled)))return;
 try{await socialRef().collection('records').doc(cloudUser.uid).set({nickname:String(document.getElementById('socialNickname')?.value||'Спортсмен').trim().slice(0,32)||'Спортсмен',...socialStats(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
 socialNote('Тільки рекорди та досягнення опубліковано');await refreshFriends();}catch(e){socialNote('Не вдалося опублікувати: '+e.message)} }
async function approveFriend(){if(!cloudUser||cloudUser.uid!==FRIENDS_OWNER_UID)return;
 const id=(document.getElementById('friendUid')?.value||'').trim();if(!/^[a-zA-Z0-9_-]{15,128}$/.test(id)){socialNote('Перевір UID друга');return}
 try{await socialRef().collection('members').doc(id).set({enabled:true,joinedAt:firebase.firestore.FieldValue.serverTimestamp()});await refreshFriends()}catch(e){socialNote('Не вдалося додати: '+e.message)} }

 if(!confirm('Прибрати друга з приватної групи?'))return;
 try{await socialRef().collection('members').doc(id).delete();await socialRef().collection('records').doc(id).delete();await refreshFriends()}catch(e){socialNote('Не вдалося видалити: '+e.message)} }
function friendsPage(){const configured=!!FRIENDS_OWNER_UID,owner=cloudUser?.uid===FRIENDS_OWNER_UID;
 return `<section class="panel"><h2>👥 Gym Friends</h2><p>Закрита група для близьких друзів. У Firebase публікуються тільки обраний нікнейм, рекорди вправ, кількість тренувань, активних днів та виконаних підходів. Повні тренування, заміри тіла й чернетки не публікуються.</p>
 ${!configured?'<p class="notice">Соціальний режим ще не активовано власником. Потрібно налаштувати UID власника та правила Firestore.</p>':''}
 ${!cloudUser?'<p class="notice">Для приватної групи потрібен вхід через Google.</p><button onclick="ensureFirebase();cloudSignIn()">Увійти через Google</button>':`<p class="notice">Твій UID для запрошення: <code>${esc(cloudUser.uid)}</code> <button class="small" onclick="navigator.clipboard.writeText(cloudUser.uid)">Копіювати</button></p>
 <div class="settings-actions"><button onclick="refreshFriends()" ${!configured?'disabled':''}>↻ Оновити групу</button></div>
 ${socialMembers.some(x=>x.id===cloudUser.uid&&x.enabled)||owner?`<div class="field"><label>Нікнейм для друзів</label><input id="socialNickname" maxlength="32" value="${esc(socialMembers.find(x=>x.id===cloudUser.uid)?.stats?.nickname||'Спортсмен')}"></div><button class="primary" onclick="publishSocial()">🏆 Опублікувати мої рекорди</button><p><small>Оновлення тільки після натискання кнопки. Інші локальні записи залишаються на твоєму пристрої.</small></p>`:'<p class="notice">Очікуєш запрошення? Передай свій UID власнику групи. Після підтвердження натисни «Оновити групу».</p>'}
 ${owner?`<div class="field"><label>UID друга для запрошення</label><input id="friendUid" placeholder="Встав UID друга"></div><button onclick="approveFriend()">+ Додати друга</button>`:''}`}
 <p><small>${esc(socialStatus||'Поки немає завантажених результатів.')}</small></p></section>
 <section class="panel"><h2>🏅 Рекорди друзів</h2>${socialMembers.filter(m=>m.enabled&&m.stats).length?socialMembers.filter(m=>m.enabled&&m.stats).map(m=>`<div class="insight-record"><div><strong>${esc(m.stats.nickname||'Спортсмен')}</strong><small>${safeNumeric(m.stats.sessions)} тренувань · ${safeNumeric(m.stats.activeDays)} активних днів · ${safeNumeric(m.stats.setsDone)} підходів</small>${(Array.isArray(m.stats.records)?m.stats.records:[]).map(r=>`<small>${esc(r.name)}: ${safeNumeric(r.weight)} кг × ${safeNumeric(r.reps)}</small>`).join('')}</div>${owner&&m.id!==FRIENDS_OWNER_UID?`<button class="small" onclick="removeFriend('${esc(m.id)}')">Виключити</button>`:''}</div>`).join(''):'<div class="empty">Поки немає опублікованих рекордів. Учасники з’являться після запрошення та публікації.</div>'}</section>`;
}

// Start Firebase on every launch, even when the cloud panel remains hidden.
window.addEventListener('load',()=>{if(CLOUD_CONFIG?.apiKey)ensureFirebase()});
</script></body></html>
