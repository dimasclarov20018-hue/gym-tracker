function dbPut(value){return new Promise((resolve,reject)=>{let tx=db.transaction('records','readwrite');tx.objectStore('records').put(value,'snapshot');tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
function persistDB(){if(!dbReady)return;const snapshot=structuredClone({state,active,updated:new Date().toISOString()});writeQueue=writeQueue.catch(()=>{}).then(()=>dbPut(snapshot)).catch(err=>{storageMode='localStorage (помилка IndexedDB)';console.error('Gym Tracker storage:',err)});}

async function initStore(){try{db=await openDB();const saved=await dbGet();const localHasData=state.templates.length>0||state.sessions.length>0||!!active;if(!localHasData&&saved&&saved.state&&Array.isArray(saved.state.templates)&&Array.isArray(saved.state.sessions)){state=saved.state;active=saved.active||null;try{localStorage.setItem(KEY,JSON.stringify(state));if(active)localStorage.setItem(DRAFTKEY,JSON.stringify(active))}catch(_){};}dbReady=true;storageMode='localStorage + IndexedDB';persistDB();}catch(e){storageMode='localStorage';console.warn('IndexedDB unavailable:',e)}render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dateFmt(d){return new Date(d+'T12:00:00').toLocaleDateString('uk-UA',{day:'numeric',month:'long',year:'numeric'})}let menuOpen=false;function syncMenu(){document.body.classList.toggle('menu-open',menuOpen);document.getElementById('mobileBackdrop').classList.toggle('hidden',!menuOpen);document.getElementById('mobileDrawer').classList.toggle('hidden',!menuOpen);document.getElementById('mobileDrawer').classList.toggle('open',menuOpen)}function openMenu(){menuOpen=true;syncMenu()}function closeMenu(){menuOpen=false;syncMenu()}function toggleMenu(){menuOpen=!menuOpen;syncMenu()}function nav(t){tab=t;closeMenu();render()}const menu=[['home','Огляд'],['workout','Тренування'],['plan','Розклад'],['history','Історія'],['progress','Прогрес'],['insights','Досягнення'],['settings','Дані']];document.getElementById('tabs').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b)nav(b.dataset.tab)});document.getElementById('mobileTabs').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b)nav(b.dataset.tab)});document.getElementById('dateLabel').textContent=new Date().toLocaleDateString('uk-UA',{day:'numeric',month:'short'});document.getElementById('footerMeta').innerHTML='Локальне зберігання на пристрої · Хмарна синхронізація ще не підключена · <span class="version-tag">v'+APP_VERSION+'</span>';window.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});

function templateForDay(d){return state.templates.filter(x=>x.day===d)}function addTemplate(){const el=document.getElementById('newExercise'),name=el.value.trim();if(!name)return;state.templates.push({id:uid(),day:editDay,name});el.value='';save();render();document.getElementById('newExercise')?.focus()}function removeTemplate(id){if(!confirm('Прибрати вправу з розкладу?'))return;state.templates=state.templates.filter(t=>t.id!==id);save();render()}function plan(){return `<section class="panel"><h2>Тижневий розклад</h2><div class="row">${[1,2,3,4,5,6,0].map(d=>`<button class="day ${editDay===d?'active':''}" onclick="editDay=${d};render()">${DAYS[d]}</button>`).join('')}</div><div class="space"></div><h3>${FULL[editDay]}</h3>${templateForDay(editDay).length?templateForDay(editDay).map(t=>`<div class="entry row between"><strong>${esc(t.name)}</strong><button class="small danger" onclick="removeTemplate('${t.id}')">Видалити</button></div>`).join(''):'<div class="empty">На цей день вправ поки немає</div>'}<div class="row" style="margin-top:14px"><div class="field"><label>Назва вправи</label><input id="newExercise" maxlength="90" placeholder="Наприклад: жим гантелей"></div><button class="primary" onclick="addTemplate()">Додати</button></div><div class="shortcut">↵ Enter, щоб швидко додати вправу</div><p><small>Розклад задає вправи за днями тижня. Кількість підходів, повторення та вагу записуй під час тренування.</small></p></section>`}

function addExercise(){if(!active)return;const i=document.getElementById('newSessionExercise');const name=i.value.trim();if(!name)return;active.exercises.push({id:uid(),name,sets:[{id:uid(),weight:'',reps:'',done:false}]});saveDraft();render();document.getElementById('newSessionExercise')?.focus()}function addSet(e){const ss=active.exercises[e].sets;const prev=ss.at(-1);ss.push({id:uid(),weight:prev?.weight||'',reps:prev?.reps||'',done:false});saveDraft();render()}function dropSet(e,s){active.exercises[e].sets.splice(s,1);saveDraft();render()}function dropExercise(e){if(confirm('Прибрати вправу з цього тренування?')){active.exercises.splice(e,1);saveDraft();render()}}function editSet(e,s,k,val){const st=active.exercises[e].sets[s];const before=st.done;st[k]=k==='done'?val:val.replace(/[^0-9.,]/g,'').replace(',','.').slice(0,8);saveDraft();if(k==='done'){if(val&&!before)startRest();render()}}function saveSession(){if(!active)return;const completed=active.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);if(!completed&&!confirm('Немає відмічених підходів. Все одно завершити?'))return;active.finished=new Date().toISOString();state.sessions.push(JSON.parse(JSON.stringify(active)));save();active=null;stopRest();saveDraft();tab='history';render()}function workout(){if(!active)return `<section class="panel"><h2>Почати тренування</h2><p>Вибери вправи з розкладу на сьогодні або склади своє тренування з нуля.</p><div class="row"><button class="primary" onclick="start('plan')">За розкладом</button><button onclick="start('free')">Вільне тренування</button></div></section>`;return `<section class="panel"><div class="row between"><h2>${esc(active.title)}</h2><button class="small danger" onclick="if(confirm('Скасувати незавершене тренування?')){active=null;stopRest();saveDraft();render()}">Скасувати</button></div><p>${dateFmt(active.date)} · Відмічай кожен виконаний підхід</p><div class="statusrow"><span class="pill">✓ ${active.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0)} виконано</span><small>${active.exercises.reduce((n,e)=>n+e.sets.length,0)} підходів у плані</small></div><div class="progressline"><div style="width:${Math.round(100*active.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0)/Math.max(1,active.exercises.reduce((n,e)=>n+e.sets.length,0)))}%"></div></div><div class="rest-card"><div class="row between"><div><span class="eyebrow">ВІДПОЧИНОК МІЖ ПІДХОДАМИ</span><div id="restClock" class="rest-clock">00:00</div><small id="restStatus">Таймер готовий</small></div><button class="small" onclick="stopRest()">Скинути</button></div><div class="progressline"><div id="restProgress" style="width:0%"></div></div><div class="rest-presets">${[60,90,120,180].map(n=>`<button class="small ${restDuration===n?'rest-selected':''}" onclick="chooseRest(${n})">${n/60===1?'1 хв':n/60===1.5?'1:30':(n/60)+' хв'}</button>`).join('')}<button class="small primary" onclick="startRest()">▶ Старт</button></div><small>Таймер стартує автоматично, коли відмічаєш виконаний підхід.</small></div>${active.exercises.map((e,i)=>`<div class="exercise"><div class="row between"><strong>${esc(e.name)}</strong><button class="small danger" onclick="dropExercise(${i})">✕</button></div><div class="set muted sethead"><span>№</span><span style="text-align:center">Вага, кг</span><span style="text-align:center">Повт.</span><span>✓</span><span></span></div>${e.sets.map((s,j)=>`<div class="set ${s.done?'set-done':''}"><span>${j+1}</span><input inputmode="decimal" aria-label="Вага" value="${esc(s.weight)}" oninput="editSet(${i},${j},'weight',this.value)"><input inputmode="numeric" aria-label="Повторення" value="${esc(s.reps)}" oninput="editSet(${i},${j},'reps',this.value)"><input type="checkbox" aria-label="Виконано" ${s.done?'checked':''} onchange="editSet(${i},${j},'done',this.checked)"><button class="small danger" title="Видалити підхід" onclick="dropSet(${i},${j})">×</button></div>`).join('')}<button class="small" onclick="addSet(${i})">＋ Підхід</button></div>`).join('')}<div class="row"><div class="field"><label>Нова вправа</label><input id="newSessionExercise" maxlength="90" placeholder="Назва вправи"></div><button onclick="addExercise()">Додати</button></div><div class="shortcut">↵ Enter, щоб додати вправу</div><div class="space"></div><div class="stickyfinish"><button class="primary" onclick="saveSession()">✓ Завершити та зберегти</button></div><p><small>Чернетка автоматично зберігається у цьому браузері після змін.</small></p></section>`}

let progressExercise='',progressPeriod='90',progressMetric='weight';
function seriesList(){return state.sessions.filter(s=>s.finished&&Array.isArray(s.exercises)).flatMap(s=>s.exercises.map(e=>({date:s.date,name:(e.name||'').trim(),sets:(e.sets||[]).filter(x=>x.done)}))).filter(x=>x.name&&x.date)}
function chooseProgress(k,v){if(k==='exercise')progressExercise=v;if(k==='period')progressPeriod=v;if(k==='metric')progressMetric=v;render()}
function getProgressPoints(){let raw=seriesList().filter(x=>x.name===progressExercise);const days=Number(progressPeriod);if(days){let cutoff=new Date();cutoff.setHours(0,0,0,0);cutoff.setDate(cutoff.getDate()-days+1);raw=raw.filter(x=>new Date(x.date+'T12:00:00')>=cutoff)}const grouped={};raw.forEach(item=>{const val=progressMetric==='weight'?Math.max(0,...item.sets.map(x=>Number(x.weight)||0)):progressMetric==='reps'?Math.max(0,...item.sets.map(x=>Number(x.reps)||0)):item.sets.reduce((sum,x)=>sum+(Number(x.weight)||0)*(Number(x.reps)||0),0);if(!item.sets.length)return;if(!grouped[item.date])grouped[item.date]=[];grouped[item.date].push(val)});return Object.entries(grouped).sort((a,b)=>a[0].localeCompare(b[0])).map(([date,values])=>({date,value:progressMetric==='volume'?values.reduce((a,b)=>a+b,0):Math.max(...values)}))}
function chartSvg(data,unit){if(!data.length)return '<div class="empty">За цей проміжок ще немає виконаних підходів. Запиши тренування, щоб побачити свій прогрес.</div>';const W=800,H=300,L=64,R=18,T=20,B=46,PW=W-L-R,PH=H-T-B,values=data.map(x=>x.value),min=Math.min(0,...values),max=Math.max(1,...values)*1.12,range=max-min;const x=i=>L+(data.length===1?PW/2:i*PW/(data.length-1)),y=v=>T+PH-(v-min)/range*PH,pts=data.map((d,i)=>[x(i),y(d.value)]);const line=pts.map((a,i)=>(i?'L':'M')+a[0].toFixed(1)+' '+a[1].toFixed(1)).join(' ');const area=line+` L ${pts.at(-1)[0]} ${T+PH} L ${pts[0][0]} ${T+PH} Z`;const grids=Array.from({length:5},(_,i)=>{const v=min+(max-min)*i/4,Y=y(v);return `<line x1="${L}" y1="${Y}" x2="${W-R}" y2="${Y}" stroke="#304158" stroke-dasharray="4 6"/><text x="${L-10}" y="${Y+4}" fill="#8ba0bb" text-anchor="end" font-size="13">${Math.round(v).toLocaleString('uk-UA')}</text>`}).join('');const marks=[...new Set([0,Math.floor((data.length-1)/2),data.length-1])].map(i=>`<text x="${x(i)}" y="${H-12}" text-anchor="middle" fill="#9baec7" font-size="13">${new Date(data[i].date+'T12:00:00').toLocaleDateString('uk-UA',{day:'2-digit',month:'short'})}</text>`).join('');const circles=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${data.length>50?3:5}" fill="#b5d6ff" stroke="#13253a" stroke-width="2"><title>${esc(dateFmt(data[i].date))}: ${data[i].value.toLocaleString('uk-UA')} ${unit}</title></circle>`).join('');return `<div class="chart-wrap"><svg class="analytics-chart" role="img" aria-label="Графік прогресу, ${data.length} дат" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#70aeff" stop-opacity=".33"/><stop offset="1" stop-color="#70aeff" stop-opacity="0"/></linearGradient></defs>${grids}<path d="${area}" fill="url(#chartFill)"/><path d="${line}" fill="none" stroke="#9ec6ff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>${circles}${marks}</svg><div class="chart-legend">${unit} · ${data.length} дат із записами</div></div>`}
function progress(){const names=[...new Set(seriesList().map(x=>x.name))].sort((a,b)=>a.localeCompare(b,'uk'));if(!names.length)return `<section class="panel"><h2>📈 Прогрес</h2><p>Тут будуть графіки робочої ваги, повторень і загального обсягу для кожної вправи.</p><div class="empty">Спочатку заверши тренування й відміть виконані підходи. Після цього зʼявляться графіки.</div></section>`;if(!names.includes(progressExercise))progressExercise=names[0];const periods=[['30','30 днів'],['90','3 місяці'],['180','6 місяців'],['365','Рік'],['0','Увесь час']];const metrics=[['weight','Макс. вага'],['reps','Макс. повторення'],['volume','Обсяг']];const points=getProgressPoints(),unit=progressMetric==='reps'?'повт.':'кг';const vals=points.map(x=>x.value);const first=vals[0]||0,last=vals.at(-1)||0,delta=last-first;return `<section class="panel"><h2>📈 Твій прогрес</h2><p>Обери вправу, показник та часовий проміжок. Графік використовує лише відмічені виконані підходи.</p><div class="analytics-controls"><div><label for="progressExercise">Вправа</label><select id="progressExercise" onchange="chooseProgress('exercise',this.value)">${names.map(n=>`<option value="${esc(n)}" ${n===progressExercise?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div><label for="progressPeriod">Період</label><select id="progressPeriod" onchange="chooseProgress('period',this.value)">${periods.map(([v,l])=>`<option value="${v}" ${v===progressPeriod?'selected':''}>${l}</option>`).join('')}</select></div><div><label for="progressMetric">Показник</label><select id="progressMetric" onchange="chooseProgress('metric',this.value)">${metrics.map(([v,l])=>`<option value="${v}" ${v===progressMetric?'selected':''}>${l}</option>`).join('')}</select></div></div><div class="metric-row"><div class="metric"><span>Перший результат</span><strong>${points.length?first.toLocaleString('uk-UA'):'—'}</strong></div><div class="metric"><span>Останній результат</span><strong>${points.length?last.toLocaleString('uk-UA'):'—'}</strong></div><div class="metric"><span>Зміна</span><strong style="color:${delta>=0?'#78e0b9':'#ffabb4'}">${points.length?(delta>0?'+':'')+delta.toLocaleString('uk-UA'):'—'}</strong></div></div>${chartSvg(points,unit)}<p class="chart-caption">${progressMetric==='weight'?'Найбільша вага серед виконаних підходів за день.':progressMetric==='reps'?'Найбільша кількість повторень за один виконаний підхід за день.':'Сума вага × повторення всіх виконаних підходів вправи за день.'} Зміна порівнює перший та останній запис у вибраному періоді.</p></section>`}

function insights(){
 const sessions=state.sessions.filter(s=>s.finished&&/^\d{4}-\d\d-\d\d$/.test(s.date)).sort((a,b)=>a.date.localeCompare(b.date));
 const uniqueDates=[...new Set(sessions.map(s=>s.date))].sort();
 const todayDate=today();let streak=0;
 const daysAgo=n=>{let d=new Date();d.setDate(d.getDate()-n);return d.toLocaleDateString('en-CA')};
 const datesSet=new Set(uniqueDates);let start=datesSet.has(daysAgo(0))?0:1;while(datesSet.has(daysAgo(start+streak)))streak++;
 const recordMap=new Map(),byExercise=new Map();
 for(const session of sessions){for(const ex of session.exercises||[]){const name=(ex.name||'').trim();if(!name)continue;const sets=(ex.sets||[]).filter(x=>x.done);if(!sets.length)continue;const maxWeight=Math.max(...sets.map(x=>Number(x.weight)||0));const maxReps=Math.max(...sets.map(x=>Number(x.reps)||0));const volume=sets.reduce((sum,x)=>sum+(Number(x.weight)||0)*(Number(x.reps)||0),0);const old=recordMap.get(name);if(!old||maxWeight>old.weight)recordMap.set(name,{weight:maxWeight,date:session.date});if(!byExercise.has(name))byExercise.set(name,[]);byExercise.get(name).push({date:session.date,weight:maxWeight,reps:maxReps,volume});}}
 const month=new Date();month.setDate(1);month.setMonth(month.getMonth()+calendarOffset);const y=month.getFullYear(),m=month.getMonth(),monthName=month.toLocaleDateString('uk-UA',{month:'long',year:'numeric'});const firstDay=(month.getDay()+6)%7,monthLen=new Date(y,m+1,0).getDate();const cells=Array.from({length:Math.ceil((firstDay+monthLen)/7)*7},(_,i)=>{const day=i-firstDay+1;if(day<1||day>monthLen)return '<div class="calendar-day outside"></div>';const key=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;const done=datesSet.has(key),isToday=key===todayDate;return `<div class="calendar-day ${done?'done':''} ${isToday?'today':''}" title="${key}${done?' · тренування виконано':''}">${day}${done?'<span class="dot"></span>':''}</div>`}).join('');
 const names=[...byExercise.keys()].sort((a,b)=>a.localeCompare(b,'uk'));if(!names.includes(compareExercise))compareExercise=names[0]||'';const comparison=(byExercise.get(compareExercise)||[]).sort((a,b)=>a.date.localeCompare(b.date)).slice(-2);const previous=comparison.length===2?comparison[0]:null,current=comparison.at(-1);const difference=(a,b,unit)=>`${b-a>0?'+':''}${Number((b-a).toFixed(1)).toLocaleString('uk-UA')} ${unit}`;
 return `<section class="panel"><h2>🏆 Досягнення та активність</h2><p>Календар, рекорди й порівняння твоїх останніх результатів. Враховуються лише завершені тренування та виконані підходи.</p><div class="insight-cards"><div class="insight-card"><span class="cap">Днів із тренуваннями</span><span class="big">${uniqueDates.length}</span><small>за весь час</small></div><div class="insight-card"><span class="cap">Серія активності</span><span class="big">${streak} дн.</span><small>поспіль до сьогодні / вчора</small></div><div class="insight-card"><span class="cap">Вправ із рекордами</span><span class="big">${recordMap.size}</span><small>за всі записи</small></div></div></section>
 <section class="panel"><div class="calendar-toolbar"><h2 style="margin:0">📅 ${monthName}</h2><div class="row"><button class="small" onclick="shiftCalendar(-1)" aria-label="Попередній місяць">←</button><button class="small" onclick="shiftCalendar(1)" ${calendarOffset===0?'disabled':''} aria-label="Наступний місяць">→</button></div></div><div class="calendar-grid">${['Пн','Вт','Ср','Чт','Пт','Сб','Нд'].map(x=>`<div class="calendar-head">${x}</div>`).join('')}${cells}</div><p class="chart-caption">Зеленим позначені дні з завершеними тренуваннями.</p></section>
 <section class="panel"><h2>🥇 Особисті рекорди</h2>${recordMap.size?`<div class="insight-list">${[...recordMap.entries()].sort((a,b)=>a[0].localeCompare(b[0],'uk')).map(([name,item])=>`<div class="insight-record"><div><strong>${esc(name)}</strong><small>${dateFmt(item.date)}</small></div><strong>${Number(item.weight).toLocaleString('uk-UA')} кг</strong></div>`).join('')}</div>`:'<div class="empty">Рекорди з’являться після першого завершеного тренування.</div>'}<p class="chart-caption">Рекорд: найбільша записана вага одного виконаного підходу. Для вправ із вагою тіла може бути 0 кг.</p></section>
 <section class="panel"><h2>⚖️ Порівняння тренувань</h2>${names.length?`<div class="field" style="margin-bottom:14px"><label>Обери вправу</label><select onchange="compareExercise=this.value;render()">${names.map(n=>`<option value="${esc(n)}" ${n===compareExercise?'selected':''}>${esc(n)}</option>`).join('')}</select></div>${previous&&current?`<div class="compare-grid"><div class="compare-box"><small>Попередній запис · ${dateFmt(previous.date)}</small><strong>${previous.weight} кг</strong><small>${previous.reps} повт. макс. · ${Math.round(previous.volume)} кг обсягу</small></div><div class="compare-box"><small>Останній запис · ${dateFmt(current.date)}</small><strong>${current.weight} кг</strong><small>${current.reps} повт. макс. · ${Math.round(current.volume)} кг обсягу</small></div></div><p class="notice">Вага: ${difference(previous.weight,current.weight,'кг')} · Повторення: ${difference(previous.reps,current.reps,'повт.')} · Обсяг: ${difference(previous.volume,current.volume,'кг')}</p>`:'<div class="empty">Для порівняння потрібні щонайменше два записи цієї вправи.</div>'}`:'<div class="empty">Додай завершені тренування, щоб побачити порівняння.</div>'}<p class="chart-caption">Порівнюються два останні записи вправи; максимальна вага, максимальні повторення та сумарний обсяг.</p></section>`;
}

function download(){const blob=new Blob([JSON.stringify({...state,activeDraft:active||null,exported:new Date().toISOString()},null,2)],{type:'application/json'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='gym-tracker-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}async function checkForUpdates(){try{if('serviceWorker' in navigator){const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update()}if('caches' in window){for(const key of await caches.keys())if(key.startsWith('gym-tracker-shell-'))await caches.delete(key)}}catch(_){}location.href='./?refresh='+Date.now()}function settings(){return `<section class="panel"><h2>Твої дані</h2><p>Записи зберігаються локально на цьому пристрої у браузері (localStorage та, за підтримки, IndexedDB). На телефоні та ПК це окремі бази. Для перенесення скористайся експортом та імпортом. Імпорт замінює поточні дані, а не об'єднує їх.</p><p class="notice">Версія застосунку: <strong>v${APP_VERSION}</strong> · Сховище: ${esc(storageMode)}. Хмара: не підключена.</p><div class="settings-actions"><button onclick="checkForUpdates()">⟳ Перевірити оновлення</button><button class="primary" onclick="download()">↓ Завантажити резервну копію</button><button onclick="document.getElementById('importFile').click()">↑ Імпортувати JSON</button></div><p><small>Перевірка оновлення не повинна стирати локальні записи, оскільки вони зберігаються окремо від кешу оболонки застосунку.</small></p><p><small>Рекомендація: експортуй дані після важливих тренувань. Приватний режим браузера не підходить для постійного зберігання.</small></p></section>`}
document.getElementById('app').addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing||e.shiftKey)return;if(e.target.id==='newExercise'){e.preventDefault();addTemplate()}else if(e.target.id==='newSessionExercise'){e.preventDefault();addExercise()}});document.getElementById('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(!Array.isArray(d.templates)||!Array.isArray(d.sessions)||d.templates.length>5000||d.sessions.length>20000)throw Error('Невірний формат');if(!confirm('Імпорт повністю замінить поточні записи. Продовжити?'))return;state={version:1,templates:d.templates,sessions:d.sessions};save();active=d.activeDraft&&Array.isArray(d.activeDraft.exercises)?d.activeDraft:null;saveDraft();tab='home';render();alert('Імпортовано!')}catch(err){alert('Не вдалося імпортувати файл: '+err.message)}finally{e.target.value=''}});if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});initStore();
</script></body></html>
